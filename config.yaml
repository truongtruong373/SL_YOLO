# Các đường dẫn tương đối được tính từ thư mục chứa file config này.

train:
  # full: train toàn bộ tập train; devices: train lần lượt từng device.
  data_mode: devices
  data_dir: data
  pretrained: yolo_state_dict.pt
  # null: tự chọn runs/visdrone_full hoặc runs/visdrone_devices.
  output_dir: null
  num_classes: 10

  image_size: 640
  # Một round kết thúc sau khi toàn bộ device được chọn đã train xong.
  rounds: 2
  batch_size: 8
  workers: 0

  devices:
    # Đổi phần đường dẫn bên dưới sang VisDrone2019-DET-train-iid-8/device_XX
    # để huấn luyện với partition IID tạo bởi create_data_partitions.py.
    # sequential: giữ nguyên thứ tự items; shuffle: xáo trộn mỗi round;
    # rotate: dịch device bắt đầu sau mỗi round.
    order: sequential
    local_epochs: 1
    items:
      - id: 1
        name: device_01
        path: data/VisDrone2019-DET-train-iid-8/device_01
        enabled: true
      - id: 2
        name: device_02
        path: data/VisDrone2019-DET-train-iid-8/device_02
        enabled: true
      - id: 3
        name: device_03
        path: data/VisDrone2019-DET-train-iid-8/device_03
        enabled: true
      - id: 4
        name: device_04
        path: data/VisDrone2019-DET-train-iid-8/device_04
        enabled: true
      - id: 5
        name: device_05
        path: data/VisDrone2019-DET-train-iid-8/device_05
        enabled: true
      - id: 6
        name: device_06
        path: data/VisDrone2019-DET-train-iid-8/device_06
        enabled: true
      - id: 7
        name: device_07
        path: data/VisDrone2019-DET-train-iid-8/device_07
        enabled: true
      - id: 8
        name: device_08
        path: data/VisDrone2019-DET-train-iid-8/device_08
        enabled: true

  learning_rate: 0.001
  min_learning_rate: 0.00001
  weight_decay: 0.0005
  gradient_clip_norm: 10.0

  augmentation: true
  amp: true
  seed: 42

  evaluation:
    # Evaluate mỗi 5 round và luôn evaluate round cuối cùng.
    interval: 5
    # Giữ threshold thấp để AP được tính trên gần như toàn bộ đường cong PR.
    confidence_threshold: 0.001
    nms_iou_threshold: 0.7
    # Precision/recall/F1 được báo cáo tại confidence threshold này.
    f1_confidence_threshold: 0.25
    max_detections: 300
    # Một trong: val_loss, f1, map50, map50_95.
    best_metric: map50_95

  loss:
    reg_max: 16
    strides: [8, 16, 32]
    box_gain: 7.5
    cls_gain: 0.5
    dfl_gain: 1.5
    assigner_topk: 10
    assigner_alpha: 0.5
    assigner_beta: 6.0
    scale_loss_by_batch: true

predict:
  checkpoint: runs/visdrone_devices/best.pt
  image: data/VisDrone2019-DET-val/images/0000001_02999_d_0000005.jpg
  output: runs/visdrone_devices/prediction.jpg
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 300
  device: auto

test:
  checkpoint: runs/visdrone_devices/best.pt
  image: data/VisDrone2019-DET-val/images/0000001_02999_d_0000005.jpg
  output: runs/visdrone_devices/prediction.jpg
  # null: tự tìm file cùng tên trong thư mục annotations.
  annotation: null
  # null: tự đặt tên <output>_ground_truth.<ext>.
  ground_truth_output: null
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 300
  device: auto
  max_window_width: 620

visualize_features:
  checkpoint: runs/visdrone_devices/best.pt
  image: data/VisDrone2019-DET-val/images/0000001_05499_d_0000010.jpg
  output_dir: runs/visdrone_devices/privacy_features
  image_size: 640
  layers: [3, 4, 6, 10, 13, 16, 19, 22]
  # Chọn các channel có độ lệch chuẩn không gian lớn nhất để vẽ.
  channels_per_layer: 16
  colormap: magma
  device: auto

pretrained:
  checkpoint: yolo_state_dict.pt
  mode: backbone_neck
  freeze_loaded: false
  strict: true
  num_classes: 10
